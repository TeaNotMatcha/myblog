# ==========================================================
#  我的博客 —— Hugo + Stack 主题 配置文件
#  改了这里的任何一行，都要关掉预览窗口（Ctrl+C）再重新启动一次。
# ==========================================================

# 站点地址。现在只在你自己的电脑上看，所以是 localhost。
# 以后要放到网上，就换成你的真实网址，例如 https://你的名字.github.io/（末尾斜杠别丢）。
baseURL: "http://localhost:1313/"

# 站点名字：浏览器标签页、网站左上角显示的就是它
title: 我的博客

# 主题名，必须和 themes 文件夹里的文件夹名一致
theme: hugo-theme-stack

# 语言：简体中文。只保留中文一种，网站结构最干净。
languageCode: zh-cn
defaultContentLanguage: zh-cn
# 中文没有空格分词，打开这个才能正确统计字数和生成摘要
hasCJKLanguage: true

# 页脚版权，留空就不显示
copyright: ""

# 每页显示几篇文章
pagination:
    pagerSize: 5

# 文章网址格式：文章会变成 /p/文章名/
permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    mainSections:
        - post
    rssFullContent: true
    # 网站小图标：把 favicon.ico 放进 static 文件夹，这里写 /favicon.ico
    favicon: ""

    footer:
        since: 2026
        customText: ""

    dateFormat:
        published: 2006年01月02日
        lastUpdated: 2006年01月02日 15:04

    sidebar:
        emoji: 🍥
        subtitle: 随便写点什么
        avatar:
            enabled: true
            local: true
            # 想换成自己的头像：把图片命名为 avatar.png 放到 assets/img/ 文件夹里
            src: img/avatar.png

    article:
        math: true        # 支持 $公式$
        toc: true         # 自动生成目录
        readingTime: true
        license:
            enabled: false
            default: 本文采用 CC BY-NC-SA 4.0 许可协议

    # 评论功能先关着。以后想开，推荐 waline 或 giscus，填一个仓库地址就能用。
    comments:
        enabled: false
        provider: disqus

    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 5
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10
        page:
            - type: toc

    colorScheme:
        toggle: true      # 右上角的明暗切换按钮
        default: auto

    imageProcessing:
        cover:
            enabled: true
        content:
            enabled: true

# 菜单：主页/关于/归档/搜索这些项目是从各自页面的 front matter 里来的，
# 这里留空就行，但两行不要删。
menu:
    main: []
    social: []

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100
        - name: categories
          weight: 200

markup:
    goldmark:
        extensions:
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
        renderer:
            # 允许在 Markdown 里直接写 HTML
            unsafe: true
    tableOfContents:
        endLevel: 5
        ordered: true
        startLevel: 1
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4
